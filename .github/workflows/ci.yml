name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHECKPOINTER_MODE: memory
      LOG_LEVEL: WARNING
      LOG_FILE_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src/ tests/

      - name: Mypy
        run: mypy src/

      - name: Pytest default suite
        run: python -m pytest tests/ -q

      - name: Pytest CLI suite
        run: python -m pytest tests/cli -q
