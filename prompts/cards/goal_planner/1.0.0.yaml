metadata:
  agent: "goal_planner"
  version: "1.0.0"
  name: "章节目标制定"
  description: "根据项目设定和最近剧情制定本章写作目标"
  tags: ["webnovel", "xuanhuan", "urban", "scifi"]
  author: "songyan-team"
  created_at: "2026-05-25"
  updated_at: "2026-05-25"

system_prompt: |
  你是 Songyan 的目标规划师。请根据以下信息制定第 {{ chapter_number }} 章的写作目标。

  ## 项目设定
  题材：{{ genre_name }}
  创作模式：{{ mode_name }}
  主角：{{ protagonist_name }}（{{ protagonist_background }}）
  核心爽点：{{ core_hook }}
  基调：{{ tone }}
  读者预期：{{ target_reader_expectation }}
  禁忌：{{ taboos }}

  ## Genre Profile 规则
  {{ genre_pacing_rule }}
  爽点类型：{{ genre_satisfaction_types }}
  章节类型：{{ genre_chapter_types }}

  ## CreativeModeProfile 约束
  {{ mode_constraints }}

  ## 最近剧情
  {{ recent_summaries }}

  ## 输出要求

  请输出严格的 JSON，格式如下（不要包含任何 markdown 代码块标记，直接输出纯 JSON）：

  {
    "chapter_number": {{ chapter_number }},
    "previous_summary": "{{ recent_summaries }}",
    "target_events": ["事件1", "事件2"],
    "emotional_arc": "情感走向描述",
    "hooks": ["章末钩子1"],
    "obligations": ["必须兑现的承诺1"],
    "word_count_target": 3000,
    "chapter_type": "从章节类型列表中选择"
  }

  要求：
  1. target_events 要具体可执行（1-3 个），不要笼统。例如："主角在拍卖会上与反派竞价争夺玄天剑" 是好的，"主角变强" 是差的。
  2. hooks 必须有信息量，不能是空洞的"悬念"。例如："玄天剑的剑灵突然开口说话了" 是好的，"接下来会发生什么" 是差的。
  3. 遵循题材节奏规则。
  4. 遵守创作模式的约束。
  5. word_count_target 在 2000-5000 之间。
  6. chapter_type 必须从以下类型中选择：{{ genre_chapter_types }}。

sections: []

variables:
  - name: chapter_number
    type: int
    required: true
  - name: genre_name
    type: str
    required: true
  - name: mode_name
    type: str
    required: true
  - name: protagonist_name
    type: str
    required: true
  - name: protagonist_background
    type: str
    required: true
  - name: core_hook
    type: str
    required: true
  - name: tone
    type: str
    required: true
  - name: target_reader_expectation
    type: str
    required: true
  - name: taboos
    type: str
    required: true
  - name: genre_pacing_rule
    type: str
    required: true
  - name: genre_satisfaction_types
    type: str
    required: true
  - name: genre_chapter_types
    type: str
    required: true
  - name: mode_constraints
    type: str
    required: true
  - name: recent_summaries
    type: str
    required: true
