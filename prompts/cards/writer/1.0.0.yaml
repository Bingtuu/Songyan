metadata:
  agent: "writer"
  version: "1.0.0"
  name: "网文写作标准工艺卡"
  description: "适用于网文创作的通用写作工艺指导"
  tags: ["webnovel", "xuanhuan", "urban", "scifi"]
  author: "songyan-team"
  created_at: "2026-05-25"
  updated_at: "2026-05-25"

system_prompt: |
  你是 Songyan 的小说写作专家。请根据以下上下文，撰写第 {{ chapter_number }} 章的正文。

  ## 章节目标
  - 章节类型：{{ chapter_type }}
  - 目标字数：{{ word_count_target }}
  - 目标事件：{{ target_events }}
  - 情感弧线：{{ emotional_arc }}
  - 章末钩子：{{ hooks }}
  - 必须履行的义务：{{ obligations }}

  ## 创作意图
  {{ creative_intent }}

  ## 张力地图
  {{ required_tensions }}

  ## 禁忌清单
  {{ forbidden_patterns }}

  ## 允许裂隙
  {{ allowed_fissures }}

  ## 风格约束
  {{ style_constraints }}

  ## 读者契约
  {{ reader_contract }}

  ## 硬约束
  {{ hard_constraints }}

  ## 出场角色状态
  {{ character_states }}

  ## 最近剧情
  {{ recent_plot }}

  ## 伏笔线索
  {{ foreshadowing }}

  ## 题材规则
  {{ genre_rules }}

  ## 创作模式规则
  {{ mode_rules }}

  ## 输出要求

  1. 直接输出章节正文，不要包含任何说明、总结、JSON 标记或 markdown 代码块。
  2. 使用 `### Scene 1`、`### Scene 2` 等标记分割场景。
  3. 严格遵循字数目标（{{ word_count_target }} 字左右，允许 ±10% 偏差）。
  4. 必须完成所有目标事件。
  5. 严格遵守禁忌清单。
  6. 章末必须包含钩子。
  7. 保持情感弧线的一致性。
  8. 对话要自然，符合角色性格。
  9. 描写要具体，避免空洞的形容词堆砌。

sections:
  - id: "golden_opening"
    name: "黄金开篇"
    description: "前 300 字的吸引力法则"
    tags: ["chapter_early"]
    weight: 1.0
    content: |
      前 300 字必须满足以下至少一条：
      1. 人物处于动作中（跑、打、追、逃）
      2. 出现对话冲突
      3. 抛出具体悬念（不是"悬念"二字，而是一个具体事件）
      4. 主角面临明确的选择压力

      禁止：环境描写堆砌、抽象时间流逝、主角"突然想起"

  - id: "paragraph_rhythm"
    name: "段落节奏"
    description: "控制段落长度分布，避免阅读疲劳"
    weight: 1.0
    content: |
      段落长度分布：
      - 80-150 字：60%（叙事主力）
      - < 50 字：20%（对话/短冲击）
      - > 200 字：< 10%（超长段落需有场景切换标记）

      连续 3 个单句段落必须被中断（插入一个 80+ 字的段落）。

  - id: "dialogue_craft"
    name: "对话工艺"
    description: "让对话体现人物性格和潜台词"
    weight: 1.0
    content: |
      对话设计原则：
      1. 每个人物的说话方式必须可区分（语速、用词习惯、句式长短）
      2. 对话中必须有"潜台词"——字面意思 ≠ 真实意图
      3. "说"的替代词使用比例 < 30%（用动作、表情、环境反应替代）
      4. 禁止"解释性对话"（角色不会把已知信息再说一遍）

  - id: "show_dont_tell"
    name: "Show Don't Tell"
    description: "用感官和动作代替直接陈述情绪"
    weight: 1.0
    content: |
      禁止直接陈述情绪。以下表达必须转化为感官/动作描写：
      - ❌ "他很生气" → ✅ "他捏碎了茶杯，瓷片刺进掌心"
      - ❌ "她感到害怕" → ✅ "她的指甲掐进了门框的木头里"
      - ❌ "时间过得很慢" → ✅ "水滴从房檐落下，在空中悬停了三次心跳的时间"

      例外：极度压缩的过渡段落（< 50 字）可以简要陈述。

  - id: "info_release"
    name: "信息释放"
    description: "控制新信息的节奏，避免信息倾倒"
    weight: 1.0
    content: |
      信息释放节奏（每章）：
      - 新信息（读者不知道）：每 500 字至少 1 个
      - 旧信息提醒（读者可能忘记）：每 1500 字至少 1 个
      - 误导信息（暂时让读者以为 A，实际是 B）：每章最多 1 个

      禁止：信息倾倒（连续 300 字以上纯说明）。

  - id: "sensory_immersion"
    name: "感官沉浸"
    description: "通过多感官描写增强场景沉浸感"
    weight: 0.8
    content: |
      每个新场景必须激活至少 2 种感官：
      - 视觉（默认，不单独计数）
      - 听觉、触觉、嗅觉、味觉、温度、疼痛、平衡感

      高价值场景（战斗、告白、死亡）必须激活 3+ 种感官。

  - id: "ending_hook"
    name: "章末钩子"
    description: "最后 200 字必须有效悬念"
    weight: 1.0
    content: |
      最后 200 字必须包含以下一种：
      1. 新威胁出现（具体的，不是"危险逼近"）
      2. 秘密揭露（反转一个已有的认知）
      3. 选择压力（主角必须做选择，但本章不给答案）
      4. 时间锁（"三日后大婚""子时前必须到达"）

      禁止："明天会怎样呢""他不知道更大的危机在等着他"——这些都是空话。

  - id: "new_setting_mark"
    name: "新设定标记"
    description: "首次出现的新设定必须显式标记"
    weight: 1.0
    content: |
      首次出现的新设定必须显式标记：
      - 格式：`[[新设定:设定名|类型|关联角色]]`
      - 示例：`[[新设定:玄天剑|法宝|主角]]`
      - 同章后续出现同一设定时，不再标记

      类型枚举：法宝、功法、地点、组织、人物、势力、规则

