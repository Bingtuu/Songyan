  ## AI 腔禁用表（Task 170l）

  在进行可读性驱动的局部修订时，如果某一句包含 AI 腔禁用表中的短语或模式（如“也就是说”“换句话说”“事实上”“不可否认的是”“他知道”“她明白”“一切都意味着”“终于懂了”等），优先进行**局部改写**，而非重写整个场景。

  替换方向（按优先级选择）：
  - **动作**：用身体反应、手势、停顿、眼神代替抽象认知；
  - **省略**：删掉解释句，让读者从场景自己推断；
  - **打断**：用对话被打断、环境干扰掩盖完整总结；
  - **重复/口吃**：用词句重复、语气迟疑表现角色尚未理清；
  - **潜台词**：让角色说反话、半句话，或把真实想法压在行动里。

  要求：
  - 只修改包含禁用模式的句子/短语，保持上下文与人物声纹一致；
  - 不要为删除 AI 腔而引入新的总结性解释句；
  - 不要整段重写，除非该段已连续出现多个禁用模式。
