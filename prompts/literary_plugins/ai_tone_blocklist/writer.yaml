content: |
  ## AI 腔禁用表（Task 170l）

  写作时，正文与对白中**严禁**出现以下 AI 腔总结/解释型短语或模式：
  - “也就是说”“换句话说”“换言之”
  - “事实上”“不可否认的是”“必须承认”
  - “他知道”“她明白”“他终于懂了”“一切都意味着”
  - 以角色内心独白直接总结高概念信息或前因后果的长句

  替换方向（按优先级选择）：
  - **动作**：用身体反应、手势、停顿、眼神代替抽象认知；
  - **省略**：删掉解释句，让读者从场景自己推断；
  - **打断**：用对话被打断、环境干扰掩盖完整总结；
  - **重复/口吃**：用词句重复、语气迟疑表现角色尚未理清；
  - **潜台词**：让角色说反话、半句话，或把真实想法压在行动里。

  要求：
  - 禁止用主角内心独白或非人实体独白直接总结高概念信息；
  - 信息应通过角色冲突、失败或代价自然释放。
