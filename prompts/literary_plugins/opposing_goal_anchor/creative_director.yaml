content: |
  ## 角色对抗性目标锚定（Task 170k）

  在 `style_constraints` 中为每个核心人类角色输出一个 `[对抗性目标: 角色ID]` 条目，包含：
  - `goal`：本章想达成的具体目标（一句话，必须具体可执行）
  - `fear`：本章害怕发生的具体后果（一句话，必须威胁到其目标）
  - `conflict_with_protagonist`：与主角本章目标的直接冲突点（一句话）

  要求：
  - 只给 2–3 个真正与主角有交集的核心人类角色；
  - 目标/恐惧必须能在本章剧情中用行动验证，不能是抽象性格描述；
  - 冲突点必须导致角色在本章至少一次做出与主角预期相反的选择或行动。
