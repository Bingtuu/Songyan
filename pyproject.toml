[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songyan"
version = "2.0.0"
description = "Songyan（松烟）— 多 Agent 中文小说写作系统"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [
    {name = "Songyan Team"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "litellm>=1.40",
    "langchain-litellm",
    "click",
    "structlog",
    "tiktoken",
    "aiosqlite",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sentence-transformers>=2.7.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
songyan = "songyan.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["songyan*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--ignore=tests/evals --ignore=tests/cli"
pythonpath = ["src"]
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

