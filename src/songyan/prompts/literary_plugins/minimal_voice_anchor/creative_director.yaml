content: |
  ## 极简声纹锚定（Task 170j）

  为每个出场的主要人类角色输出一个 `voice_anchor`（极简声纹卡），包含：
  - `character_id`: 角色 ID
  - `emotional_register`: 本章情绪基调（1 句话，如"压抑但易怒"）
  - `verbal_tick`: 一句口头禅或高频短语（不超过 8 个字，如"我没时间"）
  - `taboo_phrase`: 该角色在当前冲突中绝对不会说的词或句式（如"对不起"）

  要求：
  - 只给 2–3 个核心人类角色；
  - 不要给每个角色都写口头禅；
  - 声纹必须服务于本章冲突，不能为了区分而区分。
